# =============================================================================
#  R E P S   ·   irgen-lang
# =============================================================================
[package]
name    = "irgen-lang"
version = "0.3.0"

# Minimum Supported Rust Version (MSRV)
rust-version = "1.85"
edition = "2024"

# License
license = "Apache-2.0 OR MIT"

# Readme
readme = "README.md"

# Description
description = "Lowers HIR to ir-lang SSA for native compilation: functions, SSA locals, control flow, records and arrays in memory, OPS operations with their policies, exception edges, and GC statepoints."

# Keywords (5 max)
keywords = ["compiler", "ssa", "lowering", "hir", "lexersketch"]

# Categories
categories = ["compilers", "no-std"]

# Links
homepage      = "https://github.com/jamesgober/irgen-lang"
repository    = "https://github.com/jamesgober/irgen-lang"
documentation = "https://docs.rs/irgen-lang"

# Authors
authors = ["James Gober <me@jamesgober.com>"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "irgen_lang"
path = "src/lib.rs"


# FEATURE FLAGS
# #################################
[features]
default = ["std"]
std = ["hir-lang/std", "ir-lang/std", "typeck-lang/std", "intern-lang/std"]


# DEPENDENCIES
# #################################
[dependencies]
# HIR, the input: the unit, its arenas, binders, ops and policies (spec v3).
hir-lang    = { version = "0.4", default-features = false }
# ir-lang 2.0, the output: SSA builder, SSA construction, statepoint insertion, validator.
# Pre-release, so pinned exactly (a later alpha may change the surface).
ir-lang     = { version = "=2.0.0-alpha.3", default-features = false }
# Types of every expression and binder (typeck-lang's side table).
typeck-lang = { version = "0.3", default-features = false }
# Symbol text for function and global names, through the interner's read
# contract `Lookup`; the major version hir-lang and typeck-lang use.
intern-lang = { version = "1", default-features = false }


# DEV DEPENDENCIES
# #################################
[dev-dependencies]
# The reference interpreter (the oracle for differential tests).
ir-lang   = { version = "=2.0.0-alpha.3", features = ["interp"] }
# The bytecode path, for the differential against it (HIR -> LSB -> VM).
bcgen-lang = "0.3"
bvm-lang   = "=2.0.0-alpha.3"
# The native path, for the end-to-end test (HIR -> ir-lang -> opt-lang ->
# backend-lang -> x86-64 machine code, run in this process): the optimizer,
# the backend (instruction selection, register allocation, emission), and
# isa-lang's assembler for the test's entry thunk and unwinder stubs. All on
# ir-lang 2.0.0-alpha.3, so one build holds one 2.0 pre-release.
opt-lang     = "0.3"
backend-lang = "0.4"
isa-lang     = "0.2"
criterion = { version = "0.5", features = ["html_reports"] }
proptest  = "1"


# BENCHMARKS
# #################################
[[bench]]
name    = "bench"
harness = false


# EXAMPLES
# #################################
[[example]]
name = "lower"
path = "examples/lower.rs"

[[example]]
name = "native"
path = "examples/native.rs"


# RELEASE PROFILE
# #################################
[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = "symbols"
